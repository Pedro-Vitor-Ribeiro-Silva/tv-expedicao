<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Expedição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    /* papelão kraft + etiqueta térmica */
    --kraft: #a8825a;
    --kraft-escuro: #8a6943;
    --kraft-claro: #c29e74;
    --etiqueta: #fbfaf6;
    --tinta: #141414;
    --tinta-suave: #5b5650;
    --tinta-forte-codigo:#0c0c0c;
    --linha: #d9d4ca;
    --ml: #ffe600;
    --shopee: #ee4d2d;
    --tiktok: #c9b8ff;
    --alerta: #d7261e;
    --ok: #1f8a4c;
    --atencao: #e8a200;

    --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --f-texto: 'Barlow', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;

    --gap: clamp(8px, 1.1vh, 16px);
    --raio: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 2px, transparent 2px 7px),
      var(--kraft);
    color: var(--tinta);
    font-family: var(--f-texto);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }

  /* ---------------------------------------------------------------- layout TV */
  .tv {
    height: 100vh;
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--gap);
    padding: var(--gap);
  }
  .avisos { grid-column: 1 / -1; grid-row: 1; display: flex; flex-direction: column; gap: 6px; }
  .coluna-esq { grid-column: 1; grid-row: 2; }
  .coluna-dir { grid-column: 2; grid-row: 2; }
  .avisos:empty { display: none; }
  .aviso {
    background: var(--alerta); color: #fff; border-radius: var(--raio);
    padding: 6px 14px; font: 600 clamp(14px, 1.9vh, 22px)/1.2 var(--f-texto);
  }
  .coluna-esq { display: grid; grid-template-rows: repeat(3, 1fr); gap: var(--gap); min-height: 0; }
  .coluna-dir { display: grid; grid-template-rows: auto 1.15fr 1fr; gap: var(--gap); min-height: 0; }

  /* ---------------------------------------------------------------- etiqueta */
  .etiqueta {
    background: var(--etiqueta);
    border-radius: var(--raio);
    box-shadow: 0 2px 0 var(--kraft-escuro), 0 6px 14px rgba(60, 40, 15, .25);
    position: relative;
    min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* fita colorida no topo, como fita adesiva */
  .fita {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(4px, .8vh, 10px) clamp(12px, 1.4vw, 22px);
    font: 800 clamp(18px, 3vh, 38px)/1 var(--f-display);
    text-transform: uppercase; letter-spacing: .02em;
  }
  .fita .total { font-weight: 700; font-size: .8em; }
  .fita .total b { font-size: 1.25em; margin-left: .25em; }
  .plat-mercado .fita { background: var(--ml); }
  .plat-shopee .fita { background: var(--shopee); color: #fff; }
  .plat-tiktok .fita { background: var(--tiktok); }

  .corpo {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.3fr 1fr;
    gap: clamp(6px, .8vw, 14px);
    padding: clamp(6px, 1vh, 14px) clamp(12px, 1.4vw, 22px) 0;
  }
  .campo { display: flex; flex-direction: column; justify-content: center; min-width: 0; border-left: 2px solid var(--linha); padding-left: clamp(6px, .7vw, 12px); }
  .campo:first-child { border-left: 0; padding-left: 0; }
  .rotulo { font: 700 clamp(11px, 1.5vh, 18px)/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-suave); }
  .valor { font: 800 clamp(30px, 7.2vh, 96px)/.95 var(--f-display); font-variant-numeric: tabular-nums; }
  .nota { font: 500 clamp(10px, 1.3vh, 15px)/1.1 var(--f-texto); color: var(--tinta-suave); margin-top: 2px; }
  /* assinatura: bloco preto invertido, como o código de triagem da etiqueta */
  .campo.pendente {
    background: var(--tinta); color: var(--etiqueta);
    border: 0; border-radius: 4px; padding: clamp(4px, .8vh, 10px) clamp(10px, 1vw, 16px);
    align-self: stretch;
  }
  .campo.pendente .rotulo { color: #cfcac0; }
  .campo.pendente .valor { font-size: clamp(36px, 9vh, 120px); }
  .campo.pendente.zerado { background: var(--ok); }

  /* progresso de bipagem desenhado como código de barras */
  .barras {
    height: clamp(10px, 1.8vh, 20px);
    margin: clamp(6px, .9vh, 12px) clamp(12px, 1.4vw, 22px);
    background:
      repeating-linear-gradient(90deg, var(--linha) 0 2px, transparent 2px 4px, var(--linha) 4px 7px, transparent 7px 9px);
    position: relative; border-radius: 2px;
  }
  .barras i {
    position: absolute; inset: 0 auto 0 0;
    background: repeating-linear-gradient(90deg, var(--tinta) 0 2px, transparent 2px 4px, var(--tinta) 4px 7px, transparent 7px 9px);
    transition: width .8s ease;
  }
  .barras span {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    background: var(--etiqueta); padding-left: 8px;
    font: 600 clamp(11px, 1.5vh, 17px)/1 var(--f-mono);
  }
  /* faixa preta com letras brancas: os códigos de coleta saltam aos olhos */
  .codigos {
    background: #000; color: #fff;
    padding: clamp(5px, .8vh, 10px) clamp(12px, 1.4vw, 22px);
    display: flex; flex-wrap: wrap; align-items: center; gap: clamp(4px, .6vh, 8px) 0;
  }
  .codigos .rotulo { margin-right: clamp(10px, 1vw, 18px); line-height: 1.05; color: #fff; opacity: .75; }
  .codigos .vazio { color: #fff; opacity: .7; }
  /* cada conta: nome pequeno em cima, código grande embaixo, separadas por divisória */
  .cod {
    display: flex; flex-direction: column; gap: 1px;
    padding: 0 clamp(10px, 1.1vw, 20px);
    border-left: 2px solid rgba(255, 255, 255, .35);
  }
  .cod-conta { font: 700 clamp(11px, 1.6vh, 19px)/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: #fff; white-space: nowrap; }
  .cod code { font: 800 clamp(20px, 3.4vh, 42px)/1.05 var(--f-mono); letter-spacing: .08em; color: #fff; }

  /* ---------------------------------------------------------------- relógio */
  .relogio {
    display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    color: var(--etiqueta); padding: 0 6px;
  }
  .relogio .hora { font: 800 clamp(36px, 8vh, 104px)/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .relogio .data { font: 700 clamp(18px, 3.2vh, 40px)/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .04em; text-align: left; margin-right: auto; }

  /* ---------------------------------------------------------------- painéis da direita */
  .caixa h2 {
    margin: 0; padding: clamp(6px, 1vh, 12px) clamp(12px, 1.2vw, 20px);
    font: 800 clamp(16px, 2.5vh, 32px)/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em;
    border-bottom: 3px solid var(--tinta);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .caixa h2 small { font: 600 .55em var(--f-texto); text-transform: none; letter-spacing: 0; color: var(--tinta-suave); }
  .coletas { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .col h3.conta-ml { font-size: clamp(12px, 1.75vh, 21px); letter-spacing: .02em; border-bottom: 2px solid var(--ml); padding-bottom: 3px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .col .coleta { flex-wrap: wrap; row-gap: 2px; }
  .col { padding: clamp(6px, .9vh, 12px) clamp(8px, .9vw, 14px); border-left: 2px solid var(--linha); overflow: hidden; display: flex; flex-direction: column; gap: clamp(3px, .5vh, 7px); }
  .col:first-child { border-left: 0; }
  .col h3 { margin: 0 0 2px; font: 800 clamp(13px, 2vh, 24px)/1 var(--f-display); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .col h3 .ponto { width: .7em; height: .7em; border-radius: 2px; display: inline-block; }
  .coleta { display: flex; align-items: baseline; gap: 8px; font: 600 clamp(14px, 2.2vh, 28px)/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
  .coleta .conta { font: 600 clamp(10px, 1.45vh, 17px)/1 var(--f-texto); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .coleta .st { font: 700 clamp(10px, 1.35vh, 16px)/1 var(--f-texto); padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
  .coleta.feita { color: #9b958b; }
  .coleta.feita .st { background: #e4f2ea; color: var(--ok); }
  .coleta.cancelada { color: #b9b3a9; text-decoration: line-through; }
  .coleta.cancelada .st { text-decoration: none; background: #eee; color: #8a857c; }
  .coleta.atrasada .st { background: var(--alerta); color: #fff; }
  .coleta.proxima { background: var(--tinta); color: var(--etiqueta); margin: 0 -6px; padding: 3px 6px; border-radius: 3px; }
  .coleta.proxima .conta { color: #cfcac0; }
  .coleta.proxima .st { background: var(--atencao); color: var(--tinta); }
  .vazio { color: var(--tinta-suave); font: 500 clamp(12px, 1.7vh, 20px)/1.3 var(--f-texto); }

  .full { flex: 1; min-height: 0; overflow: hidden; padding: clamp(4px, .6vh, 8px) clamp(12px, 1.2vw, 20px); display: flex; flex-direction: column; }
  .envio { display: grid; grid-template-columns: auto auto 1fr auto; gap: 4px clamp(8px, .9vw, 16px); align-items: baseline; padding: clamp(3px, .6vh, 8px) 0; border-bottom: 1px solid var(--linha); }
  .envio:last-child { border-bottom: 0; }
  .envio .num { font: 700 clamp(13px, 2vh, 25px)/1 var(--f-mono); }
  .envio .dia { font: 800 clamp(15px, 2.3vh, 29px)/1 var(--f-display); text-transform: uppercase; }
  .envio .dia.hoje { background: var(--ml); padding: 1px 5px; border-radius: 3px; }
  .envio .info { font: 500 clamp(11px, 1.5vh, 18px)/1.15 var(--f-texto); color: var(--tinta-suave); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .envio .info b { color: var(--tinta); font-weight: 700; text-transform: uppercase; }
  .envio .st { font: 700 clamp(10px, 1.35vh, 16px)/1 var(--f-texto); padding: 3px 6px; border-radius: 3px; background: #f1ede4; white-space: nowrap; }
  .envio .st.prep { background: var(--atencao); }

  .rodape { grid-column: 1 / -1; grid-row: 3; display: none; }
  .alertas-bipe {
    background: var(--etiqueta); border-left: 8px solid var(--alerta); border-radius: var(--raio);
    padding: 6px 14px; font: 600 clamp(13px, 1.8vh, 21px)/1.2 var(--f-texto);
  }
  .alertas-bipe code { font: 700 1em var(--f-mono); }

  /* ---------------------------------------------------------------- mensagem do admin */
  /* 1) chega em tela cheia, como uma etiqueta grande colada por cima do painel */
  .msg-tela {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 4vh 4vw;
    background: rgba(22, 15, 6, .84);
  }
  .msg-cartao {
    width: min(1500px, 100%); background: var(--etiqueta); border-radius: var(--raio); overflow: hidden;
    box-shadow: 0 3px 0 var(--kraft-escuro), 0 30px 80px rgba(0, 0, 0, .5);
    animation: colar .45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .msg-cartao .fita {
    background: var(--atencao); color: var(--tinta); display: flex; justify-content: space-between; align-items: baseline;
    font: 800 clamp(22px, 4.2vh, 52px)/1 var(--f-display); letter-spacing: .08em; padding: clamp(10px, 1.6vh, 20px) clamp(18px, 2vw, 34px);
    animation: piscar 1s steps(1) 4;
  }
  .msg-cartao .fita small { font: 700 .5em var(--f-texto); letter-spacing: 0; text-transform: none; }
  .msg-texto {
    margin: 0; padding: clamp(18px, 4vh, 56px) clamp(18px, 2.6vw, 48px) clamp(22px, 5vh, 64px);
    font: 800 clamp(34px, 9vh, 128px)/1.02 var(--f-display); text-transform: uppercase; letter-spacing: .01em;
    overflow-wrap: anywhere; white-space: pre-line;
  }
  .msg-cartao .rasgo { border-top: 2px dashed var(--linha); padding: clamp(8px, 1.2vh, 14px) clamp(18px, 2.6vw, 48px);
    font: 600 clamp(13px, 1.9vh, 22px)/1.2 var(--f-texto); color: var(--tinta-suave); }
  @keyframes colar { from { transform: translateY(-6vh) rotate(-1.5deg) scale(1.04); opacity: 0; } }
  @keyframes piscar { 50% { background: var(--tinta); color: var(--atencao); } }

  /* 2) depois de alguns segundos vira uma faixa no topo, sem esconder os números */
  .msg-faixa {
    display: flex; align-items: center; gap: clamp(10px, 1.2vw, 20px);
    background: var(--tinta); color: var(--etiqueta); border-radius: var(--raio);
    padding: clamp(6px, 1vh, 12px) clamp(10px, 1vw, 16px);
    font: 700 clamp(18px, 3.2vh, 40px)/1.1 var(--f-display); text-transform: uppercase;
  }
  .msg-faixa .tag { background: var(--atencao); color: var(--tinta); padding: 3px 10px; border-radius: 3px; font-weight: 800; letter-spacing: .06em; flex: none; }
  .msg-faixa .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-faixa .ate { flex: none; font: 600 .55em var(--f-texto); text-transform: none; color: #cfcac0; }

  /* aviso discreto quando o navegador ainda não deixou tocar som */
  .som-off {
    position: fixed; right: 12px; bottom: 12px; z-index: 40; border: 0; cursor: pointer;
    background: var(--tinta); color: var(--etiqueta); border-radius: 999px; padding: 8px 14px;
    font: 600 14px/1 var(--f-texto); opacity: .85;
  }
  @media (prefers-reduced-motion: reduce) { .msg-cartao, .msg-cartao .fita { animation: none; } }

  .carregando { color: var(--etiqueta); font: 700 24px var(--f-display); display: grid; place-items: center; height: 100vh; text-transform: uppercase; letter-spacing: .1em; }
  [hidden] { display: none !important; }
  body.ocioso { cursor: none; }

  /* ---------------------------------------------------------------- celular / telas estreitas */
  @media (max-width: 900px), (orientation: portrait) {
    .tv { height: auto; grid-template-columns: 1fr; grid-template-rows: none; }
    .coluna-esq, .coluna-dir { grid-template-rows: none; grid-column: 1; grid-row: auto; }
    .avisos, .rodape { grid-row: auto; }
    .avisos { order: -2; }
    .relogio { justify-content: space-between; }
    .corpo { grid-template-columns: 1fr 1fr; row-gap: 10px; padding-bottom: 4px; }
    .campo:nth-child(3), .campo:nth-child(5) { border-left: 0; padding-left: 0; }
    .campo.pendente { padding-left: 10px; }
    .valor { font-size: 44px; }
    .campo.pendente .valor { font-size: 52px; }
    .coletas { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
    .col:nth-child(odd) { border-left: 0; }
    .col { border-left: 0; border-top: 2px solid var(--linha); }
    .col:first-child { border-top: 0; }
    .full { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { .barras i { transition: none; } }
</style>
</head>
<body>

<div id="carregando" class="carregando">Carregando…</div>

<!-- Painel -->
<main id="tv" class="tv" hidden>
  <div class="avisos" id="avisos"></div>

  <section class="coluna-esq" aria-label="Plataformas">
    <article class="etiqueta plat-mercado" id="card-mercado"></article>
    <article class="etiqueta plat-shopee" id="card-shopee"></article>
    <article class="etiqueta plat-tiktok" id="card-tiktok"></article>
  </section>

  <section class="coluna-dir">
    <div class="relogio">
      <div class="data" id="data"></div>
      <div class="hora" id="hora">--:--</div>
    </div>

    <article class="etiqueta caixa">
      <h2>Coletas de hoje <small id="coletas-sub"></small></h2>
      <div class="coletas" id="coletas"></div>
    </article>

    <article class="etiqueta caixa">
      <h2>Full Mercado Livre <small id="full-sub"></small></h2>
      <div class="full" id="lista-full"></div>
    </article>
  </section>

  <div class="rodape" id="rodape"></div>
</main>

<!-- Mensagem do admin (tela cheia ao chegar) -->
<div class="msg-tela" id="msg-tela" hidden role="alert" aria-live="assertive">
  <div class="msg-cartao">
    <div class="fita"><span>Aviso</span><small id="msg-quando"></small></div>
    <p class="msg-texto" id="msg-texto"></p>
    <div class="rasgo" id="msg-rodape"></div>
  </div>
</div>

<button type="button" class="som-off" id="som-off" hidden>🔇 Toque aqui para ligar o som dos avisos</button>

<script>
// ============================================================== configuração
const SUPABASE_URL = 'https://tkfbfsinueeaeecivjxu.supabase.co';
// Chave pública (anon). Ela só lê os totais e dados do painel; pedidos e bipes ficam fechados no banco.
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZmJmc2ludWVlYWVlY2l2anh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0NjEzNDgsImV4cCI6MjExMTAzNzM0OH0.YIAiHxoa13wi5xj09AJVluOtIpHA6gcakEyBwmDHNdA';

const PLATAFORMAS = [
  { chave: 'mercado', nome: 'Mercado Livre', cor: 'var(--ml)' },
  { chave: 'shopee', nome: 'Shopee', cor: 'var(--shopee)' },
  { chave: 'tiktok', nome: 'TikTok Shop', cor: 'var(--tiktok)' }
];
// Minutos sem atualização antes de mostrar o aviso vermelho.
// ML recarrega a cada 30 min, então só avisa se passar de uma rodada perdida.
const LIMITE_MIN = { upseller: 10, ml: 70 };
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const DEMO = new URLSearchParams(location.search).has('demo');
const ATUALIZAR_SEG = 5;
const sb = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: false, autoRefreshToken: false }
});

// Mensagem do admin: fica em tela cheia por estes segundos, depois vira faixa no topo.
const MSG_TELA_CHEIA_SEG = 20;

let estado = { resumo: [], contas: [], fontes: [], config: {}, alertas: [], mensagem: null };

// ============================================================== utilidades
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
function agoraSP() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { data: `${g('year')}-${g('month')}-${g('day')}`, hm: `${g('hour') === '24' ? '00' : g('hour')}:${g('minute')}` };
}
const minutos = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + (m || 0); };
const apelido = c => c.apelido || (c.nome || c.conta_id || '').split(' ').slice(0, 3).join(' ');

// "25/nov 2026" -> Date (ou null)
function dataFull(s) {
  const m = String(s || '').match(/(\d{1,2})\/(\w{3})\.?\s*(\d{4})?/i);
  if (!m) return null;
  const mes = MESES.indexOf(m[2].toLowerCase());
  if (mes < 0) return null;
  return new Date(Number(m[3] || new Date().getFullYear()), mes, Number(m[1]));
}

// ============================================================== carga de dados
async function carregar() {
  if (DEMO) { estado = dadosDemo(); desenhar(); return; }
  const [resumo, contas, fontes, config, alertas, mensagens] = await Promise.all([
    sb.from('painel_resumo').select('*'),
    sb.from('mercado_livre_contas').select('conta_id,nome,apelido,codigo_coleta,coletas,envios_full,atualizado_em'),
    sb.from('status_fontes').select('*'),
    sb.from('configuracoes').select('*'),
    sb.from('painel_alertas').select('*').limit(50),
    sb.from('mensagens_painel').select('*').order('id', { ascending: false }).limit(1)
  ]);
  const erro = [resumo, contas, fontes, config, alertas].find(r => r.error);
  if (erro) throw erro.error;
  estado = {
    resumo: resumo.data, contas: contas.data, fontes: fontes.data,
    config: Object.fromEntries(config.data.map(c => [c.chave, c.valor])), alertas: alertas.data,
    mensagem: mensagens.error ? null : (mensagens.data[0] || null)
  };
  desenhar();
}

// Evita duas buscas ao mesmo tempo; se pedirem outra no meio, faz mais uma no fim.
let buscando = false, buscarDeNovo = false;
async function atualizarAgora() {
  if (buscando) { buscarDeNovo = true; return; }
  buscando = true;
  try { await carregar(); } catch (e) { mostrarErroCarga(e); }
  buscando = false;
  if (buscarDeNovo) { buscarDeNovo = false; atualizarAgora(); }
}

// Ao vivo: quando o app de administração muda algo, o banco avisa o painel na hora.
function ouvirMudancas() {
  let espera;
  const mudou = () => { clearTimeout(espera); espera = setTimeout(atualizarAgora, 150); };
  const canal = sb.channel('painel-ao-vivo');
  for (const tabela of ['mensagens_painel', 'configuracoes', 'mercado_livre_contas'])
    canal.on('postgres_changes', { event: '*', schema: 'public', table: tabela }, mudou);
  canal.subscribe();
}

function mostrarErroCarga(e) {
  console.error(e);
  $('avisos').innerHTML = `<div class="aviso">Sem conexão com o banco de dados (${esc(e.message || e)}). Tentando de novo…</div>`;
}

// Busca os dados a cada poucos segundos (sem sobrepor buscas).
async function cicloAtualizacao() {
  await atualizarAgora();
  setTimeout(cicloAtualizacao, ATUALIZAR_SEG * 1000);
}

// ============================================================== desenho
function desenhar() {
  for (const p of PLATAFORMAS) desenharCartao(p);
  desenharColetas();
  desenharFull();
  desenharMensagem();
  desenharAvisos();
}

function desenharCartao(p) {
  const r = estado.resumo.find(x => x.plataforma === p.chave) || {};
  const total = (r.impressao_pendente || 0) + (r.impresso || 0);
  const imp = r.impresso || 0;
  const pct = imp ? Math.min(100, Math.round((r.bipado || 0) / imp * 100)) : 0;

  let codigos = '';
  if (p.chave === 'mercado') {
    const lista = [...estado.contas].sort((a, b) => apelido(a).localeCompare(apelido(b)))
      .filter(c => c.codigo_coleta)
      .map(c => `<div class="cod"><span class="cod-conta">${esc(apelido(c))}</span><code>${esc(c.codigo_coleta)}</code></div>`).join('');
    codigos = `<div class="codigos"><span class="rotulo">Código<br>de coleta</span>${lista || '<span class="vazio">aguardando…</span>'}</div>`;
  }

  $('card-' + p.chave).innerHTML = `
    <div class="fita"><span>${p.nome}</span><span class="total">Total<b>${fmt(total)}</b></span></div>
    <div class="corpo">
      <div class="campo"><span class="rotulo">Impressão pendente</span><span class="valor">${fmt(r.impressao_pendente)}</span></div>
      <div class="campo"><span class="rotulo">Impresso</span><span class="valor">${fmt(imp)}</span></div>
      <div class="campo"><span class="rotulo">Enviado</span><span class="valor">${fmt(r.enviado)}</span><span class="nota">já saiu na coleta</span></div>
      <div class="campo pendente ${r.pendente ? '' : 'zerado'}"><span class="rotulo">Pendente</span><span class="valor">${fmt(r.pendente)}</span></div>
      <div class="campo"><span class="rotulo">Bipado</span><span class="valor">${fmt(r.bipado)}</span></div>
    </div>
    <div class="barras" role="img" aria-label="${pct}% das etiquetas impressas hoje já bipadas"><i style="width:${pct}%"></i><span>${pct}%</span></div>
    ${codigos}`;
}

function classeColetaML(c) {
  const s = (c.status || '').toUpperCase();
  if (s.includes('CANCEL')) return ['cancelada', 'cancelada'];
  if (c.tipo === 'realizada' || s.includes('CONCLU')) return ['feita', 'feita'];
  if (s.includes('ATRAS')) return ['atrasada', 'atrasada'];
  if (s.includes('CAMINHO')) return ['', 'a caminho'];
  return ['', 'prevista'];
}

function desenharColetas() {
  const agora = minutos(agoraSP().hm);

  // Mercado Livre: uma coluna por conta, lado a lado
  const contas = estado.contas.slice().sort((a, b) => apelido(a).localeCompare(apelido(b), 'pt-BR'));
  $('coletas').innerHTML = contas.map(conta => {
    const lista = (conta.coletas || []).slice().sort((a, b) => minutos(a.inicio) - minutos(b.inicio));
    let proximaMarcada = false;
    const linhas = lista.map(c => {
      let [cls, st] = classeColetaML(c);
      if (!cls && !proximaMarcada) { cls = 'proxima'; proximaMarcada = true; }
      else if (cls === 'atrasada' && !proximaMarcada) { proximaMarcada = true; }
      return `<div class="coleta ${cls}"><span>${esc(c.inicio)}–${esc(c.fim)}</span><span class="st">${st}</span></div>`;
    }).join('');
    return `<div class="col"><h3 class="conta-ml" title="${esc(conta.nome || '')}">${esc(apelido(conta))}</h3>${linhas || '<span class="vazio">Sem coleta hoje.</span>'}</div>`;
  }).join('') || '<div class="col"><span class="vazio">Nenhuma conta do ML enviou dados ainda.</span></div>';
}

function desenharFull() {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const envios = estado.contas.flatMap(c => (c.envios_full || []).map(e => ({ ...e, conta: apelido(c), d: dataFull(e.data) })))
    .sort((a, b) => (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity));
  $('full-sub').textContent = envios.length ? `${envios.length} envio${envios.length > 1 ? 's' : ''}` : '';
  $('lista-full').innerHTML = envios.map(e => {
    let dia = 'sem data', hojeCls = '';
    if (e.d) {
      const diff = Math.round((e.d - hoje) / 86400000);
      dia = diff === 0 ? 'hoje' : diff === 1 ? 'amanhã' : `${e.d.getDate()}/${MESES[e.d.getMonth()]}`;
      if (diff <= 0) hojeCls = 'hoje';
    }
    const prep = /prepara/i.test(e.status || '');
    return `<div class="envio">
      <span class="dia ${hojeCls}">${dia}</span>
      <span class="num">#${esc(e.numero)}</span>
      <span class="info"><b>${esc(e.conta)}</b> · ${esc(e.unidades || '?')} un · ${esc(e.produto || '')}</span>
      <span class="st ${prep ? 'prep' : ''}">${esc(e.status || '')}</span>
    </div>`;
  }).join('') || '<span class="vazio">Nenhum envio Full em preparação ou aguardando recebimento.</span>';
}

function desenharAvisos() {
  const avisos = [];
  const agora = Date.now();
  for (const f of estado.fontes) {
    const ml = f.fonte.startsWith('ml:');
    const nome = ml ? `Mercado Livre ${apelido(estado.contas.find(c => 'ml:' + c.conta_id === f.fonte) || { nome: f.fonte })}` : 'UpSeller';
    const min = f.atualizado_em ? (agora - new Date(f.atualizado_em)) / 60000 : Infinity;
    const limite = ml ? LIMITE_MIN.ml : LIMITE_MIN.upseller;
    // Erros passageiros (outro navegador resolve no ciclo seguinte) não aparecem:
    // só avisa quando a fonte fica sem nenhuma atualização boa além do limite.
    if (min > limite) avisos.push(`⚠ ${nome}: sem atualizar há ${min === Infinity ? 'muito tempo' : Math.round(min) + ' min'}. Verifique o navegador da expedição.${f.erro ? ' — Último erro: ' + f.erro : ''}`);
  }
  if (!estado.fontes.some(f => f.fonte === 'upseller')) avisos.push('⚠ UpSeller ainda não enviou dados. Verifique a extensão no navegador da expedição.');
  const m = mensagemNoAr();
  const faixa = m && $('msg-tela').hidden
    ? `<div class="msg-faixa"><span class="tag">Aviso</span><span class="txt">${esc(m.texto)}</span><span class="ate">some em ${duracao(Math.max(0, Math.ceil((new Date(m.expira_em) - Date.now()) / 1000)))}</span></div>`
    : '';
  $('avisos').innerHTML = faixa + avisos.map(a => `<div class="aviso">${esc(a)}</div>`).join('');

  // Bipes com problema hoje
  const al = estado.alertas || [];
  const rod = $('rodape');
  if (!al.length) { rod.style.display = 'none'; return; }
  const nomes = { duplicado: 'repetidos', plataforma_errada: 'no leitor errado', nao_encontrado: 'não encontrados no UpSeller' };
  const cont = {};
  al.forEach(a => cont[a.alerta] = (cont[a.alerta] || 0) + 1);
  const u = al[0];
  rod.style.display = 'block';
  rod.innerHTML = `<div class="alertas-bipe">Bipes com problema hoje: ${Object.entries(cont).map(([k, n]) => `${n} ${nomes[k] || k}`).join(' · ')}
    — último: <code>${esc(u.codigo)}</code> (${esc(nomes[u.alerta] || u.alerta)})</div>`;
}

// ============================================================== relógio
function relogio() {
  const d = new Date();
  $('hora').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
  $('data').innerHTML = d.toLocaleDateString('pt-BR', { weekday: 'long', timeZone: 'America/Sao_Paulo' }) + '<br>' +
    d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'America/Sao_Paulo' });
}

// ============================================================== mensagem do admin
const horaSP = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
// 90 -> "1 min 30 s"; 45 -> "45 s"
function duracao(seg) {
  if (seg < 60) return `${seg} s`;
  const h = Math.floor(seg / 3600), m = Math.floor(seg % 3600 / 60), s = seg % 60;
  return [h && `${h} h`, m && `${m} min`, s && `${s} s`].filter(Boolean).join(' ');
}
function mensagemNoAr() {
  const m = estado.mensagem;
  return m && new Date(m.expira_em).getTime() > Date.now() ? m : null;
}

let msgAnunciada = null;   // id da última mensagem que já tocou o som
let msgTelaCheiaAte = 0;   // até quando a mensagem fica em tela cheia
let msgChaveDesenho = '';

function desenharMensagem() {
  const m = mensagemNoAr();
  if (!m) { $('msg-tela').hidden = true; msgTelaCheiaAte = 0; return; }
  if (m.id !== msgAnunciada) {
    msgAnunciada = m.id;
    // Só "chega" com tela cheia e som se acabou de ser enviada
    // (se a TV for ligada no meio de uma mensagem, ela aparece direto como faixa).
    if (Date.now() - new Date(m.criada_em).getTime() < 2 * 60000) {
      msgTelaCheiaAte = Date.now() + MSG_TELA_CHEIA_SEG * 1000;
      if (m.som) tocarAviso();
    }
  }
  const resta = Math.max(0, Math.ceil((new Date(m.expira_em) - Date.now()) / 1000));
  $('msg-texto').textContent = m.texto;
  $('msg-quando').textContent = `enviado às ${horaSP(m.criada_em)}`;
  $('msg-rodape').textContent = `Some do painel em ${duracao(resta)}.`;
  $('msg-tela').hidden = Date.now() >= msgTelaCheiaAte;
}

// Chamada a cada segundo: passa de tela cheia para faixa e tira a mensagem quando vence.
function conferirMensagem() {
  if (!estado.mensagem) return;
  desenharMensagem();
  // a faixa mostra a contagem regressiva, então redesenha a cada segundo enquanto houver mensagem
  const noAr = mensagemNoAr();
  const chave = (noAr ? noAr.id + '|' + Math.ceil(Date.now() / 1000) : '-') + '|' + $('msg-tela').hidden;
  if (chave !== msgChaveDesenho) { msgChaveDesenho = chave; desenharAvisos(); }
}

// ============================================================== som
// O navegador só libera som depois de um toque/tecla na página. Se ainda não
// liberou, aparece um botão discreto no canto; um toque em qualquer lugar resolve.
let audio = null;
function contextoAudio() {
  if (!audio) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) { audio = new C(); audio.addEventListener?.('statechange', conferirSom); }
  }
  return audio;
}
// Tenta ligar o som sozinho (funciona quando o navegador da TV permite som automático,
// ex.: Chrome com --autoplay-policy=no-user-gesture-required, ou Fully Kiosk com áudio liberado).
function tentarSomAutomatico() {
  liberarSom();
  setInterval(() => { if (audio && audio.state !== 'running') audio.resume().then(conferirSom, conferirSom); }, 10000);
}
// Tela cheia: o navegador só deixa entrar depois de um toque/tecla. O primeiro toque
// (ou OK do controle) já entra; se alguém sair, o próximo toque volta. No Chrome com
// --kiosk a janela já ocupa a tela toda e nada aparece.
const telaGrande = () => Math.min(screen.width, screen.height) >= 600 && !matchMedia('(pointer: coarse) and (max-width: 900px)').matches;
const emTelaCheia = () => !!(document.fullscreenElement || document.webkitFullscreenElement) ||
  (innerHeight >= screen.height - 2 && innerWidth >= screen.width - 2);
function entrarTelaCheia() {
  if (!telaGrande() || emTelaCheia()) return;
  const el = document.documentElement;
  const pedir = el.requestFullscreen || el.webkitRequestFullscreen;
  if (pedir) Promise.resolve(pedir.call(el, { navigationUI: 'hide' })).catch(() => {}).finally(conferirSom);
}
function conferirSom() {
  const ctx = contextoAudio();
  const semSom = !!ctx && ctx.state !== 'running';
  const semTela = telaGrande() && !emTelaCheia();
  const b = $('som-off');
  b.hidden = !semSom && !semTela;
  b.textContent = semSom && semTela ? '⛶ Toque aqui para tela cheia e som'
    : semSom ? '🔇 Toque aqui para ligar o som dos avisos' : '⛶ Toque aqui para tela cheia';
}
function liberarSom() {
  entrarTelaCheia();
  const ctx = contextoAudio();
  if (ctx && ctx.state !== 'running') ctx.resume().then(conferirSom, conferirSom);
}
for (const ev of ['fullscreenchange', 'webkitfullscreenchange', 'resize']) addEventListener(ev, () => setTimeout(conferirSom, 300));
// "Ding-dong" de três notas, duas vezes: chama atenção sem ser sirene.
function tocarAviso() {
  const ctx = contextoAudio();
  if (!ctx) return;
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  const t0 = ctx.currentTime + 0.05;
  const notas = [[784, 0], [1047, 0.2], [1319, 0.4], [784, 1.3], [1047, 1.5], [1319, 1.7]];
  for (const [freq, ini] of notas) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0 + ini);
    g.gain.exponentialRampToValueAtTime(0.6, t0 + ini + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + 0.9);
    o.connect(g).connect(ctx.destination);
    o.start(t0 + ini);
    o.stop(t0 + ini + 1);
  }
}
// ============================================================== início
async function iniciarPainel() {
  $('carregando').hidden = true;
  $('tv').hidden = false;
  relogio();
  setInterval(() => { relogio(); conferirMensagem(); }, 1000);
  conferirSom();
  tentarSomAutomatico();
  if (DEMO) await carregar();
  else { cicloAtualizacao(); ouvirMudancas(); }
  manterTelaLigada();
}

async function manterTelaLigada() {
  try {
    if (!('wakeLock' in navigator)) return;
    await navigator.wakeLock.request('screen');
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {});
    });
  } catch { /* navegador não permite: ignora */ }
}

// esconde o cursor do mouse quando parado (TV)
let ocioso;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('ocioso');
  clearTimeout(ocioso);
  ocioso = setTimeout(() => document.body.classList.add('ocioso'), 4000);
});

// qualquer toque ou tecla libera o som; tocar na mensagem em tela cheia a recolhe para a faixa
for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, liberarSom);
$('msg-tela').addEventListener('click', () => { msgTelaCheiaAte = 0; conferirMensagem(); });
iniciarPainel();
